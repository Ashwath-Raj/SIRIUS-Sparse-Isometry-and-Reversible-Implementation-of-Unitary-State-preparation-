name: Tests & Regression Gates

on:
  push:
    branches: [ main, "cleanup/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  cpu-tests:
    name: CPU Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run CPU test suite
        run: |
          pytest -v

      - name: Validate Phase 9.1 benchmark plan contract
        run: |
          python scripts/phase9_1_validate.py --plan benchmarking/config/phase9_1_benchmark_plan.json

      - name: Validate Phase 9.1 smoke tier manifest generation
        run: |
          python scripts/phase9_1_validate.py \
            --plan benchmarking/config/phase9_1_benchmark_plan.json \
            --tier smoke \
            --emit-manifest /tmp/sirius-smoke-plan.json

      - name: Verify reference source file manifest
        run: |
          python scripts/verify_sources.py
