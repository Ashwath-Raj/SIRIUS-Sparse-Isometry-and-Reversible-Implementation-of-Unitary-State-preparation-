[package]
name = "sparse_state_preparation"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Code for the paper: Sparse quantum state preparation with improved Toffoli cost"
readme = "README.md"

[lib]
name = "_isometry_algorithms"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["extension-module", "abi3-py39"] }
wide = "1.0.2"
numpy = "0.27.0"
